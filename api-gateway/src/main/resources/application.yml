spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Accept
              - Authorization
              - Content-Type
              - Idempotency-Key
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/v1/auth/**

        - id: booking-service-slots
          uri: http://booking-service:8080
          predicates:
            - Path=/v1/admin/tours/*/slots/**,/v1/admin/tours/*/departures/**

        - id: booking-service-admin-departures
          uri: http://booking-service:8080
          predicates:
            - Path=/v1/admin/departures/**

        - id: tour-service-admin
          uri: http://tour-service:8080
          predicates:
            - Path=/v1/admin/tours/**

        - id: booking-service-admin
          uri: http://booking-service:8080
          predicates:
            - Path=/v1/admin/bookings/**

        - id: payment-service-admin
          uri: http://payment-service:8080
          predicates:
            - Path=/v1/admin/payments/**

        - id: payment-service
          uri: http://payment-service:8080
          predicates:
            - Path=/v1/payments/**

        - id: tour-service-admin-tour-guides
          uri: http://tour-service:8080
          order: -1
          predicates:
            - Path=/v1/admin/tour-guides/**

        - id: auth-service-admin-demo
          uri: http://auth-service:8080
          predicates:
            - Path=/v1/admin/**

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/v1/users/**

        - id: booking-service-public-tour-slots
          uri: http://booking-service:8080
          order: -1
          predicates:
            - Path=/v1/tours/*/slots

        - id: booking-service-public-tour-departures
          uri: http://booking-service:8080
          order: -1
          predicates:
            - Path=/v1/tours/*/departures

        - id: ai-service
          uri: http://ai-service:8000
          predicates:
            - Path=/v1/ai/**

        - id: tour-service
          uri: http://tour-service:8080
          predicates:
            - Path=/v1/tours/**

        - id: booking-service
          uri: http://booking-service:8080
          predicates:
            - Path=/v1/bookings/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SIGNING_SECRET:dev_only_change_me}
