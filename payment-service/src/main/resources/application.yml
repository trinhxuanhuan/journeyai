spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:journeyai}
    password: ${SPRING_DATASOURCE_PASSWORD:journeyai_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-service-refund-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend:
    payment-result-url: ${FRONTEND_BASE_URL:http://localhost:3000}/thanh-toan/ket-qua
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:sandbox_placeholder}
    hash-secret: ${VNPAY_HASH_SECRET:sandbox_placeholder}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://localhost:8090/v1/payments/vnpay-return}
  booking-service:
    base-url: ${BOOKING_SERVICE_BASE_URL:http://booking-service:8080}
