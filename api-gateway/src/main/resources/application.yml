spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/v1/auth/**

        - id: tour-service-admin
          uri: http://tour-service:8080
          predicates:
            - Path=/v1/admin/tours/**

        - id: auth-service-admin-demo
          uri: http://auth-service:8080
          predicates:
            - Path=/v1/admin/**

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/v1/users/**

        - id: tour-service
          uri: http://tour-service:8080
          predicates:
            - Path=/v1/tours/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SIGNING_SECRET:dev_only_change_me}