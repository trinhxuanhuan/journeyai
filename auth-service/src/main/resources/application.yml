spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:journeyai}
    password: ${SPRING_DATASOURCE_PASSWORD:journeyai_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SIGNING_SECRET:dev_only_change_me}
    access-token-ttl-seconds: 900
    refresh-token-ttl-days: 30
  email:
    enabled: ${EMAIL_ENABLED:false}   # false = log ra console (dev) — đổi true khi có SMTP thật
    from-address: ${SMTP_FROM:noreply@vietkhampha.com}