name: Publish release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      tag: ${{ steps.release.outputs.tag }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
    steps:
      - name: Validate tag and normalize owner
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$sha_tag"
          else
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Release tag must follow vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER." >&2
              exit 1
            fi
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }}
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - service: auth-service
            context: .
            dockerfile: auth-service/Dockerfile
          - service: user-service
            context: .
            dockerfile: user-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: notification-service/Dockerfile
          - service: tour-service
            context: .
            dockerfile: tour-service/Dockerfile
          - service: booking-service
            context: .
            dockerfile: booking-service/Dockerfile
          - service: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish traceable image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ needs.validate-release.outputs.owner }}/journeyai-${{ matrix.service }}:${{ needs.validate-release.outputs.tag }}
            ghcr.io/${{ needs.validate-release.outputs.owner }}/journeyai-${{ matrix.service }}:${{ needs.validate-release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.title=Việt Khám Phá ${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
