services:
  postgres:
    image: postgres:16-alpine
    container_name: jai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: journeyai
      POSTGRES_PASSWORD: journeyai_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journeyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: jai-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: journeyai
      MONGO_INITDB_ROOT_PASSWORD: journeyai_dev_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: jai-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: jai-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jai-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  # ---------- Application services ----------
  # Chỉ api-gateway được publish ra host (ports). Các service còn lại dùng
  # "expose" — chỉ truy cập được TRONG Docker network nội bộ, không thể gọi
  # thẳng từ máy host (localhost:8081, 8084...) như trước đây. Đây là fix
  # bảo mật: trước đây bất kỳ ai cũng có thể gọi thẳng service, tự gắn header
  # X-User-Id giả mạo, bỏ qua hoàn toàn xác thực JWT ở Gateway.

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: jai-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service_db
      SPRING_DATASOURCE_USERNAME: journeyai
      SPRING_DATASOURCE_PASSWORD: journeyai_dev_password
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-dev_only_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@vietkhampha.vn}
    expose:
      - "8080"

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: jai-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
      SPRING_DATASOURCE_USERNAME: journeyai
      SPRING_DATASOURCE_PASSWORD: journeyai_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    expose:
      - "8080"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: jai-notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_service_db
      SPRING_DATASOURCE_USERNAME: journeyai
      SPRING_DATASOURCE_PASSWORD: journeyai_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@vietkhampha.vn}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      NOTIFICATION_EMAIL_DISPATCH_DELAY_MS: ${NOTIFICATION_EMAIL_DISPATCH_DELAY_MS:-5000}
      NOTIFICATION_EMAIL_MAX_ATTEMPTS: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:-5}
      NOTIFICATION_INBOX_RETRY_DELAY_MS: ${NOTIFICATION_INBOX_RETRY_DELAY_MS:-10000}
      NOTIFICATION_INBOX_MAX_ATTEMPTS: ${NOTIFICATION_INBOX_MAX_ATTEMPTS:-10}
      DEPARTURE_REMINDER_ENABLED: ${DEPARTURE_REMINDER_ENABLED:-true}
      DEPARTURE_REMINDER_DAYS_BEFORE: ${DEPARTURE_REMINDER_DAYS_BEFORE:-1}
      DEPARTURE_REMINDER_CRON: ${DEPARTURE_REMINDER_CRON:-0 0 8 * * *}
    expose:
      - "8080"

  tour-service:
    build:
      context: .
      dockerfile: tour-service/Dockerfile
    container_name: jai-tour-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://journeyai:journeyai_dev_password@mongodb:27017/tour_service_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URI: http://elasticsearch:9200
    expose:
      - "8080"

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: jai-booking-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_service_db
      SPRING_DATASOURCE_USERNAME: journeyai
      SPRING_DATASOURCE_PASSWORD: journeyai_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOUR_SERVICE_BASE_URL: http://tour-service:8080
    expose:
      - "8080"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: jai-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_service_db
      SPRING_DATASOURCE_USERNAME: journeyai
      SPRING_DATASOURCE_PASSWORD: journeyai_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      BOOKING_SERVICE_BASE_URL: http://booking-service:8080
    expose:
      - "8080"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: jai-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - notification-service
    environment:
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-dev_only_change_me}
    ports:
      - "8090:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: jai-ai-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://journeyai:journeyai_dev_password@mongodb:27017
      MONGO_DATABASE: ai_service_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-dev_only_change_me}
    expose:
      - "8000"

volumes:
  pg_data:
  mongo_data:
  es_data:
  kafka_data:
